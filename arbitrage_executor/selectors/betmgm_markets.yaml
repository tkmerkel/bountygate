# BETMGM Market Selector Configuration
# Last updated: 2026-05-20 (post-NBA-rename MCP walk)
#
# 2026-05-20 schema change: BetMGM dropped the "O/U" suffix from every
# player_* accordion across NBA, NHL, and NFL. Standard and alternate are
# now the SAME accordion for NBA player props — the threshold tabs
# (e.g. "10+", "15+") live inside the merged accordion. NBA picks inside
# threshold-tab accordions display as "Yes <price>" instead of
# "O <line> <price>" — executor's _click_betmgm_pick_for_player still
# expects the old format and needs an alt-pick branch before NBA std/alt
# bets can actually place (see task #26).
#
# NHL accordions kept std O/U pick format; just renamed (drop "O/U" suffix).
# MLB (batter_*, pitcher_*) was already correct per PR #12 — unchanged.

# ─────────────────────────── NBA ────────────────────────────
# All NBA player_* markets except Player blocks now use the merged
# alt-only accordion with threshold tabs. has_threshold_tabs is set on
# std entries too so the executor clicks the correct threshold tab
# matching the opp's line via calculate_alternate_tab_value().
player_points:
  accordion_name: Player points
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_assists:
  accordion_name: Player assists
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_rebounds:
  accordion_name: Player rebounds
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_threes:
  accordion_name: Player three-pointers
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_points_assists:
  accordion_name: Player points + assists
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_points_rebounds:
  accordion_name: Player points + rebounds
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_rebounds_assists:
  accordion_name: Player rebounds + assists
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
# Triple-combo accordion visible on the 2026-05-20 Spurs/Thunder walk —
# previously unmapped, surfaced via unmapped-market Discord alert
# (Jalen Williams over 19.5 in the 19:25 ET worker tick).
player_points_rebounds_assists:
  accordion_name: Player points + rebounds + assists
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
# Player blocks is the lone holdout — still std O/U pick format on the
# expanded accordion (no threshold tabs, only team-filter tabs which the
# executor leaves on the default "All" selection).
player_blocks:
  accordion_name: Player blocks
player_turnovers:
  accordion_name: Player turnovers
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
# 1st-quarter markets still use std O/U on a non-merged accordion.
# player_points_q1 was confirmed working in the 2026-05-20 worker run.
player_points_q1:
  accordion_name: 'Player points: 1st quarter'

# Legacy NBA _alternate entries — kept for backward compatibility with
# upstream feeds that still emit `_alternate`-suffixed market_keys. They
# point at the SAME accordion as the std entry above; has_threshold_tabs
# drives the tab click.
player_points_alternate:
  accordion_name: Player points
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_assists_alternate:
  accordion_name: Player assists
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_rebounds_alternate:
  accordion_name: Player rebounds
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_threes_alternate:
  accordion_name: Player three-pointers
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_blocks_alternate:
  accordion_name: Player blocks
  is_alternate: true
player_turnovers_alternate:
  accordion_name: Player turnovers
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
# Combo-alt entries — surfaced as unmapped-market alerts during the
# 2026-05-20 worker runs. Std and alt point at the same merged
# accordion (see comment near the std entries above); has_threshold_tabs
# drives the threshold tab click.
player_points_assists_alternate:
  accordion_name: Player points + assists
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_points_rebounds_alternate:
  accordion_name: Player points + rebounds
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_rebounds_assists_alternate:
  accordion_name: Player rebounds + assists
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")
player_points_rebounds_assists_alternate:
  accordion_name: Player points + rebounds + assists
  is_alternate: true
  has_threshold_tabs: true
  tab_selector_pattern: button:has-text("{threshold}+")

# ─────────────────────────── NFL ────────────────────────────
player_receptions:
  accordion_name: Receptions made

# ─────────────────────────── NHL ────────────────────────────
# NHL kept the std O/U pick format. Just dropped "O/U" suffix from
# accordion labels. "Player shots" replaces the never-validated
# `player_shots_on_goal` placeholder. Note: NHL "Player points",
# "Player assists" share accordion names with NBA — single YAML entries
# above resolve both because the executor's threshold-tab click degrades
# gracefully when the tab isn't found (NHL's team-filter tabs are left
# on the default "All").
player_shots_on_goal:
  accordion_name: Player shots
player_blocked_shots:
  accordion_name: Player blocked shots
player_power_play_points:
  accordion_name: Player power play points
goalie_saves:
  accordion_name: Goalie saves
# `player_goals` removed: BetMGM no longer carries a std-line Player goals
# accordion. Goals are split into "Anytime goalscorer" (price-only Yes/No)
# and "Player to score 2+/3+ goals" (also price-only). Upstream opps for
# this market have no BetMGM-side line to match; executor was logging
# "Accordion not found: 'Player goals O/U'" for every opp.

