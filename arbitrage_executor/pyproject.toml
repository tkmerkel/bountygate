[project]
name = "dev-bg-browser"
version = "0.1.0"
description = "Local Windows arbitrage bot: Playwright + Chrome CDP, places paired FanDuel/BetMGM bets from a Postgres-backed task queue."
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Pinned to the versions known-working in the local .venv as of 2026-05-15.
# Use `~=` (compatible release) to allow patches without surprise majors.
# The local `bountygate` shared package (../app/shared/python) is installed
# separately via `pip install -e ../app/shared/python`.
dependencies = [
    "playwright~=1.57",
    "sqlalchemy~=2.0",
    "pandas~=2.3",
    "pyyaml~=6.0",
    "psycopg2-binary~=2.9",
    "python-dotenv~=1.2",
    "rapidfuzz>=3.0",
    "requests>=2.31",     # transitively needed by bountygate.utils.discord_notify
    "numpy>=1.26",        # transitively needed by bountygate transformers
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
